name: D3SOX nightly packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: d3sox-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.build }}
      count: ${{ steps.version.outputs.count }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          tag="d3sox-nightly-r${count}"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              build=false
              echo "Already released $tag; use a manual run to rebuild it." >> "$GITHUB_STEP_SUMMARY"
            else
              previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '[.[] | select(.tag_name | startswith("d3sox-nightly-r"))][0].tag_name // empty')
              # Only explicitly non-build files may skip a scheduled release.
              if [[ -n "$previous_tag" ]] && git diff --quiet "$previous_tag" HEAD -- \
                . \
                ':(exclude)README.md' \
                ':(exclude)CONTRIBUTING.md' \
                ':(exclude)AGENTS.md' \
                ':(exclude)docs/**' \
                ':(exclude)assets/fork/**' \
                ':(exclude)packaging/pages/**' \
                ':(exclude)packaging/aur/README.md' \
                ':(exclude).github/ISSUE_TEMPLATE/**' \
                ':(exclude).github/PULL_REQUEST_TEMPLATE.md' \
                ':(exclude).github/workflows/fork-pages.yml'; then
                build=false
                echo "Only documentation, landing-page, or other non-build files changed since $previous_tag." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  arch:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib at-spi2-core gdk-pixbuf2 git gtk3 hicolor-icon-theme imagemagick \
            libcups libdrm libsecret libxcomposite libxcrypt-compat libxdamage libxfixes libxkbcommon \
            libxrandr mesa nodejs-lts-krypton nspr nss pango pkgconf pnpm rust xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /packaging/aur/t3code-d3sox-git/
          sparse-checkout-cone-mode: false
      - name: Build package from this release commit
        run: |
          set -euo pipefail
          useradd --create-home builder
          install -d -o builder -g builder /tmp/t3code-d3sox-build
          install -o builder -g builder -m 644 packaging/aur/t3code-d3sox-git/PKGBUILD /tmp/t3code-d3sox-build/PKGBUILD
          cd /tmp/t3code-d3sox-build
          runuser -u builder -- env T3CODE_SOURCE_COMMIT="$GITHUB_SHA" makepkg --noconfirm
          install -d "$RUNNER_TEMP/arch-package"
          install -m 644 ./*.pkg.tar.zst "$RUNNER_TEMP/arch-package/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d3sox-arch-package
          path: ${{ runner.temp }}/arch-package/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_NO_DOTENV: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_FORK_ANDROID_BUILD: "1"
      T3CODE_FORK_ANDROID_VERSION_CODE: ${{ needs.plan.outputs.count }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Expose pnpm
        run: |
          pnpm_version=$(node --print "require('./package.json').packageManager.split('@').pop()")
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Bundle compatible Android C++ runtime
        run: |
          set -euo pipefail
          # React Native's packaged libc++ lacks a symbol required by libfbjni on arm64.
          sdkmanager --install 'ndk;28.2.13676358'
          ndk_lib="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          runtime_dir="$RUNNER_TEMP/android-libcxx"
          for target in arm64-v8a:aarch64-linux-android armeabi-v7a:arm-linux-androideabi x86:i686-linux-android x86_64:x86_64-linux-android; do
            abi=${target%%:*}
            triplet=${target#*:}
            install -Dm644 "$ndk_lib/$triplet/libc++_shared.so" "$runtime_dir/lib/$abi/libc++_shared.so"
            readelf -Ws "$runtime_dir/lib/$abi/libc++_shared.so" | grep -F __cxa_init_primary_exception >/dev/null
          done
          patched="$RUNNER_TEMP/android-patched.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$patched"
          zip -d "$patched" 'lib/*/libc++_shared.so' >/dev/null
          (cd "$runtime_dir" && zip -0 "$patched" lib/*/libc++_shared.so >/dev/null)
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/zipalign" -P 16 -f 4 "$patched" "$RUNNER_TEMP/android-aligned.apk"
          "$build_tools/zipalign" -c -P 16 4 "$RUNNER_TEMP/android-aligned.apk"
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.D3SOX_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.D3SOX_ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          keystore="$RUNNER_TEMP/android-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$build_tools"
          install -d "$RUNNER_TEMP/android-package"
          apk="$RUNNER_TEMP/android-package/T3-Code-D3SOX-Android-r${RELEASE_COUNT}.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias t3code-d3sox \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$apk" \
            "$RUNNER_TEMP/android-aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | head -n 1 | grep "name='com.t3tools.t3code.preview'"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p "$apk" "lib/$abi/libc++_shared.so" | cmp - "$RUNNER_TEMP/android-libcxx/lib/$abi/libc++_shared.so"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d3sox-android-apk
          path: ${{ runner.temp }}/android-package/*.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, arch, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:base
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Install signing and publishing tools
        run: pacman -Syu --noconfirm --needed git github-cli gnupg pacman
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /packaging/aur/t3code-d3sox-git/signing-key.asc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d3sox-arch-package
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d3sox-android-apk
          path: packages
      - name: Sign package and create pacman repository
        env:
          ARCH_GPG_KEY: ${{ secrets.D3SOX_ARCH_GPG_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCH_GPG_KEY"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME" site/arch/x86_64
          printf '%s' "$ARCH_GPG_KEY" | gpg --batch --import
          key=5A4D66D6943777AD48A5F169972812D8A4CFBA4D
          gpg --batch --list-secret-keys "$key" >/dev/null
          package=$(find packages -maxdepth 1 -name 't3code-d3sox-git-*.pkg.tar.zst' -print -quit)
          test -n "$package"
          install -m 644 "$package" site/arch/x86_64/
          package="site/arch/x86_64/${package##*/}"
          gpg --batch --local-user "$key" --detach-sign --output "$package.sig" "$package"
          repo-add --sign --key "$key" --include-sigs \
            site/arch/x86_64/t3code-d3sox.db.tar.zst "$package"
          for alias in t3code-d3sox.db t3code-d3sox.db.sig t3code-d3sox.files t3code-d3sox.files.sig; do
            cp -L "site/arch/x86_64/$alias" "site/arch/x86_64/$alias.copy"
            mv "site/arch/x86_64/$alias.copy" "site/arch/x86_64/$alias"
          done
          install -m 644 packaging/aur/t3code-d3sox-git/signing-key.asc site/arch/
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          package=$(find site/arch/x86_64 -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          apk=$(find packages -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$package" && test -n "$apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" "$package.sig" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # A moving main can make --target $GITHUB_SHA fail for GITHUB_TOKEN.
            # Create the tag at the build commit, then release the existing tag.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
            fi
            gh release create "$RELEASE_TAG" "$package" "$package.sig" "$apk" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "D3SOX nightly r${RELEASE_COUNT}" --prerelease --latest=false \
              --notes "Automated fork build from ${GITHUB_SHA}. Android APK: com.t3tools.t3code.preview. Arch Linux: t3code-d3sox-git. The Android and Arch packages use dedicated signing keys; see the repository README before installing."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d3sox-pacman-site
          path: site/
          if-no-files-found: error
          compression-level: 0
